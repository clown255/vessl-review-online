    ctx.fillStyle = '#f2b233'; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, 11, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#1a1206'; ctx.font = '600 11px Inter, system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(rotulo, x, y + 0.5);
    ctx.restore();
  }
  // vídeo parado: desenhos dos comentários deste quadro (ou do trecho que o contém) + o rascunho
  function redesenhar(){
    posicionar();
    ctx.clearRect(0, 0, area.w, area.h);
    var v = versao();
    if (!area.w || !v || !dados) return;
    var q = quadroAgora(), tr = [], pinos = [];
    if (video.paused) dados.comentarios.forEach(function(c){
      if (c.versaoId !== v.id) return;
      if (!(c.quadroFim != null ? q >= c.quadro && q <= c.quadroFim : q === c.quadro)) return;
      if (c.desenho && c.desenho.length) tr = tr.concat(c.desenho);
      if (c.alfinete) pinos.push([c.alfinete, (c.autor || '?').charAt(0).toUpperCase()]);
    });
    var meu = desenhando || (video.paused && q === quadroRascunho);
    if (meu) tr = tr.concat(rascunho);
    if (atual) tr.push(atual);
    tr.forEach(function(t){ traco(t, area.w, area.h); });
    pinos.forEach(function(p){ pino(p[0], p[1]); });
    if (meu && alfinete) pino(alfinete, '+');
  }
  // escolher a ferramenta liga o desenho no vídeo; a mesma de novo (ou Esc) desliga
  function usar(f){
    ferramenta = f; desenhando = !!f;
    if (desenhando) {
      video.pause();
      // voltar ao quadro do rascunho que já existe
      if (temRascunho() && quadroAgora() !== quadroRascunho) ir(quadroRascunho / fpsAgora() + 0.001);
    }
    lousa.classList.toggle('ativo', desenhando);
    marcarFerramentas(); estado(); redesenhar();
  }
  function mudou(){ marcarFerramentas(); quando(); redesenhar(); }
  function desfazer(){ if (rascunho.length) rascunho.pop(); else alfinete = null; mudou(); }
  // rascunho de outro quadro não se mistura com o novo
  function noQuadroAgora(){
    if (temRascunho() && quadroRascunho !== quadroAgora()) { rascunho = []; alfinete = null; }
    quadroRascunho = quadroAgora();
  }
  function pontoDe(e){
    var r = lousa.getBoundingClientRect();
    return [Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)), Math.max(0, Math.min(1, (e.clientY - r.top) / r.height))];
  }
  lousa.addEventListener('pointerdown', function(e){
    if (!desenhando || e.button !== 0) return;
    e.preventDefault();
    var p = pontoDe(e);
    if (ferramenta === 'alfinete') { noQuadroAgora(); alfinete = p; mudou(); return; }
    if (rascunho.length >= MAX_TRACOS) return;
    lousa.setPointerCapture(e.pointerId);
    atual = {tipo: ferramenta, cor: corAtual, largura: LARGURA, pontos: ferramenta === 'livre' ? [p] : [p, p]};
  });
  lousa.addEventListener('pointermove', function(e){
    if (!atual) return;
    var p = pontoDe(e);
    if (atual.tipo === 'livre') { if (atual.pontos.length < MAX_PONTOS) atual.pontos.push(p); }
    else atual.pontos[1] = p;
    redesenhar();
  });
  function terminarTraco(){
    if (!atual) return;
    var t = atual, p = t.pontos, a = p[0], b = p[p.length - 1];
    atual = null;
    // clique sem arrastar não vira traço
    if (p.length > 1 && (Math.abs(b[0] - a[0]) + Math.abs(b[1] - a[1]) > 0.004 || p.length > 3)) { noQuadroAgora(); rascunho.push(t); }
    mudou();
  }
  lousa.addEventListener('pointerup', terminarTraco);
  lousa.addEventListener('pointercancel', terminarTraco);
  lousa.addEventListener('click', function(e){ e.stopPropagation(); });

  // barra embaixo da caixa: ferramentas, cores (com uma ferramenta de traço) e "N shapes ↶"
  var caixaF = $('ferramentas'), cores = el('span', 'cores'), conta = el('span', 'conta'), contaTxt = el('span');
  function botaoIc(rotulo, nome, acao){
    var b = el('button', 'ic'); b.type = 'button'; b.title = rotulo; b.setAttribute('aria-label', rotulo);
    icone(b, nome); b.onclick = acao; return b;
  }
  FERRAMENTAS.forEach(function(f){
    var b = botaoIc(f[1], f[2], function(){ usar(ferramenta === f[0] ? null : f[0]); });
    b.setAttribute('data-f', f[0]); caixaF.appendChild(b);
  });
  cores.setAttribute('role', 'radiogroup'); cores.setAttribute('aria-label', 'Drawing color');
  CORES.forEach(function(c){
    var b = el('button', 'cor'); b.type = 'button'; b.style.background = c;
    b.setAttribute('role', 'radio'); b.setAttribute('data-c', c); b.setAttribute('aria-label', 'Color ' + c);
    b.onclick = function(){ corAtual = c; marcarFerramentas(); };
    cores.appendChild(b);
  });
  caixaF.appendChild(cores);
  conta.appendChild(contaTxt);
  var desfazerB = botaoIc('Undo last shape', 'desfazer', desfazer);
  conta.appendChild(desfazerB);
  caixaF.appendChild(conta);
  function marcarFerramentas(){
    [].forEach.call(caixaF.querySelectorAll('[data-f]'), function(b){ b.setAttribute('aria-pressed', String(b.getAttribute('data-f') === ferramenta)); });
    [].forEach.call(cores.querySelectorAll('[data-c]'), function(b){ b.setAttribute('aria-checked', String(b.getAttribute('data-c') === corAtual)); });
    cores.hidden = !ferramenta || ferramenta === 'alfinete';
    var n = rascunho.length + (alfinete ? 1 : 0);
    conta.hidden = !n;
    contaTxt.textContent = n + (n === 1 ? ' shape' : ' shapes');
    desfazerB.title = rascunho.length ? 'Undo last shape' : 'Remove pin';
    desfazerB.setAttribute('aria-label', desfazerB.title);
  }

  // "00:07 for one frame ▾": onde o comentário começa e quanto ele dura (como no app)
  function inicioQuadro(){ return temRascunho() ? quadroRascunho : quadroAgora(); }
  function fimQuadro(){
    if (!durSeg) return null;
    var q = inicioQuadro(), fps = fpsAgora(), ult = Math.max(q, Math.floor(duracao() * fps) - 1);
    var f = Math.min(ult, q + Math.max(1, Math.round(durSeg * fps)));
    return f > q ? f : null;
  }
  function rotuloDur(s){ s = Math.round(s * 10) / 10; return s + (s === 1 ? ' second' : ' seconds'); }
  var durTxt = $('durTxt'), menu = $('menuDur'), seta = el('span');
  seta.innerHTML = ICONES.abaixo; $('durBotao').appendChild(seta);
  function quando(){
    $('inicioTxt').textContent = tempo(inicioQuadro() / fpsAgora());
    durTxt.textContent = durSeg ? rotuloDur(durSeg) : 'one frame';
    pintarFaixa(); dicaTexto();
  }
  function pintarFaixa(){
    var f = $('faixa'), d = duracao(), fps = fpsAgora(), fim = fimQuadro(), ini = inicioQuadro();
    f.hidden = fim == null || !d;
    if (f.hidden) return;
    f.style.left = Math.min(100, ini / fps / d * 100) + '%';
    f.style.width = Math.max(0, Math.min(100, (fim - ini) / fps / d * 100)) + '%';
  }
  function dicaTexto(){ $('texto').placeholder = temRascunho() ? 'Describe the drawing…' : 'Write a comment… (C)'; }
  function itemDur(rotulo, seg){
    var b = el('button', 'itemDur', rotulo); b.type = 'button'; b.setAttribute('role', 'menuitemradio');
    b.setAttribute('data-s', String(seg));
    b.onclick = function(){ durSeg = seg; abrirMenu(false); quando(); };
    menu.appendChild(b);
  }
  itemDur('One frame', 0);
  DURACOES.forEach(function(s){ itemDur(rotuloDur(s), s); });
  menu.appendChild(el('div', 'sepMenu'));
  var custom = el('label', 'custom'), cx = el('span', 'cx'), campo = el('input');
  custom.appendChild(document.createTextNode('Custom'));
  campo.type = 'text'; campo.inputMode = 'decimal'; campo.placeholder = '0'; campo.setAttribute('aria-label', 'Duration in seconds');
  cx.appendChild(campo); cx.appendChild(el('span', 'para', 's')); custom.appendChild(cx); menu.appendChild(custom);
  function aplicarCampo(){
    var s = parseFloat(campo.value.replace(',', '.'));
    durSeg = isFinite(s) && s > 0 ? Math.min(s, 600) : 0; quando();
  }
  campo.addEventListener('keydown', function(e){
    // Enter aqui não pode mandar o comentário
    if (e.key === 'Enter') { e.preventDefault(); aplicarCampo(); abrirMenu(false); }
  });
  campo.addEventListener('blur', aplicarCampo);
  function abrirMenu(abrir){
    menu.hidden = !abrir;
    $('durBotao').setAttribute('aria-expanded', String(abrir));
    if (!abrir) return;
    campo.value = durSeg ? String(Math.round(durSeg * 10) / 10) : '';
    [].forEach.call(menu.querySelectorAll('[data-s]'), function(b){ b.setAttribute('aria-checked', String(+b.getAttribute('data-s') === durSeg)); });
  }
  $('durBotao').onclick = function(e){ e.stopPropagation(); abrirMenu(menu.hidden); };
  menu.addEventListener('click', function(e){ e.stopPropagation(); });
  document.addEventListener('click', function(){ if (!menu.hidden) abrirMenu(false); });

  ['seeked', 'pause', 'loadeddata', 'loadedmetadata'].forEach(function(ev){ video.addEventListener(ev, redesenhar); });
  ['seeked', 'loadedmetadata', 'timeupdate'].forEach(function(ev){ video.addEventListener(ev, quando); });
  video.addEventListener('play', function(){ if (desenhando) usar(null); else redesenhar(); });
  window.addEventListener('resize', redesenhar);
  document.addEventListener('fullscreenchange', function(){ requestAnimationFrame(redesenhar); });
  if (window.ResizeObserver) new ResizeObserver(function(){ redesenhar(); }).observe(video);
  marcarFerramentas();

  // ---------- reações ----------
  EMOJIS.forEach(function(e){
    var b = el('button', 'emoji', e); b.type = 'button';
    b.title = 'React ' + e + ' at this moment'; b.setAttribute('aria-label', 'React ' + e);
    b.onclick = function(){
      comNome(function(){
        var v = versao(); if (!v) return;
        var voa = el('span', 'voa', e); voa.setAttribute('aria-hidden', 'true'); b.appendChild(voa);
        setTimeout(function(){ voa.remove(); }, 900);
        mandar('reagir', {versaoId: v.id, quadro: quadroAgora(), emoji: e, autor: lerNome()}, $('avisoDecisao'));
      });
    };
    $('emojis').appendChild(b);
  });

  // ---------- comentar e decidir ----------
  $('comentar').onclick = function(){ comNome(function(){ video.pause(); $('texto').focus(); }); };
  $('texto').addEventListener('focus', function(){ video.pause(); if (!lerNome()) { $('texto').blur(); comNome(function(){ $('texto').focus(); }); } });
  video.addEventListener('error', function(){ if (video.getAttribute('src')) $('aviso').textContent = 'The video could not be played in this browser.'; });
  $('form').addEventListener('submit', function(e){
    e.preventDefault();
    var v = versao(), t = $('texto').value.trim();
    if (!v) return;
    if (!t) { $('aviso').textContent = 'Write a comment.'; $('texto').focus(); return; }
    comNome(function(){
      $('enviar').disabled = true;
      // começa no quadro do desenho (ou no de agora) e dura o que o menu diz
      var corpo = {
        versaoId: v.id, texto: t, autor: lerNome(), desenho: rascunho, alfinete: alfinete,
        quadro: inicioQuadro(), quadroFim: fimQuadro()
      };
      mandar('comentar', corpo, $('aviso')).then(function(ok){
        $('enviar').disabled = false;
        if (!ok) return;
        $('texto').value = ''; rascunho = []; alfinete = null; durSeg = 0;
        usar(null); quando();
      });
    });
  });
  $('texto').addEventListener('keydown', function(e){ if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) $('form').requestSubmit(); });
  function decidir(status){ comNome(function(){ var v = versao(); if (v) mandar('status', {versaoId: v.id, status: status, autor: lerNome()}, $('avisoDecisao')); }); }
  $('aprovar').onclick = function(){ decidir('aprovado'); };
  $('ajustar').onclick = function(){ decidir('ajustar'); };

  // o que a equipe muda no app aparece aqui sozinho
  setInterval(function(){ if (document.visibilityState === 'visible' && document.activeElement !== $('texto') && $('fundoNome').hidden) carregar(true); }, 15000);
  if (ONLINE) window.addEventListener('hashchange', function(){ codigo = decodeURIComponent(location.hash.replace(/^#/, '')); carregar(false); });
  mostrarNome();
  carregar(false);
})();
</script>
